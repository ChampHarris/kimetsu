plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
}

apply from: rootProject.file('gradle/quality.gradle')

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// core/ compiles twice: on its own in :core (no Minecraft on its classpath, so the compiler enforces core purity) and
// here, so its classes ship inside the mod jar and load as part of the kimetsu mod. Every mod compile (runClient and
// runGameTestServer included) runs the pure compile first, so an engine import in core/ fails whichever task you run.
sourceSets.main.java.srcDir('core/src/main/java')
tasks.named('compileJava') {
    dependsOn ':core:compileJava'
}

// The mod's own JUnit tests: plain JUnit with Minecraft's libraries (DFU, Gson) on the classpath and no game bootstrap,
// so they run in seconds. They compile core/'s Fixtures (its test fixtures) next to them: the combat JSON is checked
// against the spec's values there, so the two can't drift (D-052).
sourceSets.test.java.srcDir('core/src/testFixtures/java')

sourceSets.main.resources {
    srcDir('src/generated/resources')   // datagen output: runData purges this folder, so never hand-place files in it
    srcDir('src/generated/scope')       // the vanilla-scope pack, written only by tools/vanilla_scope.py (R7-01)
    exclude('**/*.bbmodel')
    exclude('.cache/**')                // datagen cache
}

repositories {
    exclusiveContent {                                          // MCTest (dev runs only); nothing else may resolve there
        forRepository { maven { url = 'https://maven.coolerpromc.com/releases/' } }
        filter { includeGroup 'com.coolerpromc.mctest' }
    }
    exclusiveContent {                                          // Modrinth Maven, only for maven.modrinth:*
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {                                          // AzureDoom's Maven, only for AzureLib (ADR 0001, D-123)
        forRepository { maven { url = 'https://maven.azuredoom.com/mods' } }
        filter { includeGroup 'mod.azure.azurelib' }
    }
    mavenCentral()      // the quality tools (gradle/quality.gradle); MDG adds only Mojang's and NeoForged's repositories
}

neoForge {
    version = project.neo_version
    // An access transformer line that names a missing class or member fails the build instead of doing nothing.
    validateAccessTransformers = true

    runs {
        client {
            client()
            // The AzureLib spike (5d-3a, D-123): `./gradlew runClient -PazureSpike=true` draws the M1 demon through
            // AzureLib instead of the stand-in.
            systemProperty 'kimetsu.azure_spike', (project.findProperty('azureSpike') ?: 'false').toString()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Runs the mod's GameTests, then exits; the exit code is the number of failed required tests. The selection
        // matters: without it vanilla's optional always_pass runs too, and a suite that stopped registering would still
        // pass. A selection that matches nothing exits -1. (NeoForge 26.3 reads no neoforge.enabledGameTestNamespaces.)
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            programArguments.addAll('--tests', "${project.mod_id}:*")
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // JetBrains Runtime hot reload (docs/tools/toolchain.md step 2); other JVMs ignore it because of the first flag.
            jvmArguments.addAll('-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo(sourceSets.test)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
}

// localRuntime: dev runs only, never in the jar.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // AzureLib (ADR 0001's demon runtime; 4.1.2 for the 5d-3a spike, D-123): the M1 demon's renderer behind the spike flag.
    implementation "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"

    // Dev tools, pinned 2026-10-18 (ADR 0002; Modrinth version IDs because version numbers repeat across loaders).
    localRuntime("com.coolerpromc.mctest:mctest-neoforge-26.3:26.3.0.3") { transitive = false }
    localRuntime("maven.modrinth:spark:HwHxykP9")        // spark 1.10.187 (NeoForge 26.x)
    localRuntime("maven.modrinth:jei:wSzwAzVB")          // JEI 31.16.0.84, beta
    localRuntime("maven.modrinth:worldedit:ByRNkO83")    // WorldEdit 7.4.6

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Chunky (maven.modrinth:chunky:EyCqftOK, 1.5.4) joins at M5 for the worldgen review: until then its deprecated
    // logoFile property puts NeoForge's loading-warning screen in front of every dev launch.
}

// Dependency verification (gradle/verification-metadata.xml) records what the machine writing it resolves, and Gradle
// picks Minecraft's natives (LWJGL's) for the host OS through minecraft-dependencies' operating-system variants. These
// three ask for every OS's natives, so metadata written on Windows covers CI's Linux too. No build task resolves them;
// only `--write-verification-metadata` and reports such as `dependencies` do (D-033).
var nativesScope = configurations.dependencyScope('verificationNatives')
dependencies {
    verificationNatives "net.neoforged:minecraft-dependencies:${minecraft_version}"
}
['windows', 'osx', 'linux'].each { os ->
    configurations.resolvable("verificationNatives${os.capitalize()}") {
        extendsFrom nativesScope.get()
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(net.neoforged.minecraftdependencies.MinecraftDistribution.ATTRIBUTE,
                    objects.named(net.neoforged.minecraftdependencies.MinecraftDistribution, 'client'))
            attribute(net.neoforged.minecraftdependencies.OperatingSystem.ATTRIBUTE,
                    objects.named(net.neoforged.minecraftdependencies.OperatingSystem, os))
        }
    }
}

// Expands the properties above into META-INF/neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            azurelib_version       : azurelib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
