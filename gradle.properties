org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Platform: ADR 0001 (R6-01, accepted by Champ 2026-10-19). Pins move only on purpose; run /port-plan before a hop.
# The hooks read minecraft_version, neo_version, java_version and mod_id from this file.
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.92
java_version=25

# The mod (Champ, 2026-10-19)
mod_id=kimetsu
mod_name=Kimetsu: Breath & Blood
mod_license=All Rights Reserved
mod_version=0.0.1
mod_group_id=dev.champ.kimetsu

# Libraries: ADR 0001 (R6-02, accepted by Champ 2026-10-19), Maven coordinates verified there. Each one becomes a
# dependency with the first M1 code that uses it, so Build 0's dedicated-server GameTests don't load beta client libraries early.
pal_version=1.2.8+mc.26.3
bendable_cuboids_version=2.1.0+mc.26.3
azurelib_version=4.1.2
geckolib_version=5.5.7
smartbrainlib_version=2.0.3

# Tests (core/)
junit_version=5.14.4

# Code quality gates (ADR 0002, D-033): gradle/quality.gradle
palantir_version=2.102.0
errorprone_version=2.50.0
nullaway_version=0.14.2
# Minecraft 26.3 ships JSpecify 1.0.0 and NeoForge's classpath resolves 1.0.1; the annotations are the same
jspecify_version=1.0.1
