pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    // The code quality gates (ADR 0002, D-033), pinned here once; both build files apply them without a version.
    plugins {
        id 'com.diffplug.spotless' version '8.10.4'
        id 'net.ltgt.errorprone' version '5.1.1'
    }
}

plugins {
    // Finds or downloads the JDK 25 toolchain (and the daemon JVM in gradle/gradle-daemon-jvm.properties).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'kimetsu'

// core/: the version-proof combat rules as plain Java 25 (CLAUDE.md, Architecture). It compiles on its own with
// no Minecraft on its classpath, so an engine import there fails the build; the mod compiles the same sources too.
include 'core'
