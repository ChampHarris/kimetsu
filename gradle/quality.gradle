// The code quality gates, shared by the mod and core/ (ADR 0002, D-033). Each build file applies the plugins, then this.

// Formatting: palantir-java-format through Spotless. `./gradlew spotlessApply` formats; `spotlessCheck` runs in `check`.
// LF on every OS: the Java here is LF in the index, and Spotless's default (Git's end-of-line settings) would expect
// CRLF on a Windows checkout with core.autocrlf, failing every file there and passing on CI. Javadoc isn't reflowed.
spotless {
    lineEndings = 'UNIX'
    java {
        // Relative to each project: the mod's own src/, never core/ through the mod's second source dir.
        target 'src/*/java/**/*.java'
        palantirJavaFormat(palantir_version)
    }
}

// Static analysis: Error Prone, with NullAway checking nullness the JSpecify way. Minecraft marks its packages
// @NullMarked, and every package here does the same in its package-info.java; RequireExplicitNullMarking fails a class
// outside one, since NullAway would silently skip it. Any javac or Error Prone warning fails the build (-Werror),
// removal warnings included. JSpecify is the one library core/ may import: annotations only, compile-only (D-033).
dependencies {
    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    errorprone "com.uber.nullaway:nullaway:${nullaway_version}"
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    testCompileOnly "org.jspecify:jspecify:${jspecify_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Werror')
    options.errorprone {
        error('NullAway', 'RequireExplicitNullMarking')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
}

// Test code (every source set but main) hands null to code on purpose; Error Prone's other checks still run on it.
sourceSets.matching { it.name != 'main' }.configureEach { set ->
    tasks.named(set.compileJavaTaskName) {
        options.errorprone.disable('NullAway', 'RequireExplicitNullMarking')
    }
}
