// The combat rules as plain Java 25 with JUnit only. Nothing from Minecraft, NeoForge or the mod libraries is on
// this classpath, so `./gradlew :core:test` is fast and an engine import here fails the build (the hook also blocks it).
// The one exception is JSpecify's nullness annotations, compile-only, added by gradle/quality.gradle (D-033).
plugins {
    id 'java'
    id 'java-test-fixtures' // Fixtures: the spec's values, shared with the mod's tests, which check the JSON against them
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
}

apply from: rootProject.file('gradle/quality.gradle')

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
}

dependencies {
    testFixturesCompileOnly "org.jspecify:jspecify:${jspecify_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'hot-path', 'sim', 'measure'
    }
    testLogging {
        exceptionFormat = 'full' // CI's log then shows each failed assertion's message
    }
}

// The allocation checks on the hot paths (Performance Budget), with escape analysis off: a JIT that scalar-replaces an
// allocation here might not where the mod calls it. `check` (and so `build`) runs them. `-Pbench` also holds the
// printed timings to the budget, which shared CI runners are too noisy to do.
def hotPathTest = tasks.register('hotPathTest', Test) {
    description = 'Runs the hot-path allocation and timing checks.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'hot-path'
    }
    jvmArgs '-XX:-DoEscapeAnalysis'
    systemProperty 'kimetsu.bench', providers.gradleProperty('bench').isPresent().toString()
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// The bots (spec Tests, "Sim parity" and "Exploit bots"; D-044): fights through the real engine against the duel sim's
// reference rates (`tools/sims/parity_reference.py`) and against honest play. Their numbers are player models, not
// balance, so they live in the test sources; `check` runs them, and their report goes to build/reports/sim/.
def simTest = tasks.register('simTest', Test) {
    description = 'Runs the bot fights: sim parity, the exploit bots and determinism.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'sim'
    }
    mustRunAfter hotPathTest // it uses every core, and the allocation measurements want them quiet
    systemProperty 'kimetsu.sim.report', layout.buildDirectory.dir('reports/sim').get().asFile.path
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// Measurements behind decisions, rerun on demand (not in check): today the clash win's Posture share (D-050, R9-12).
tasks.register('simMeasure', Test) {
    description = 'Reruns the bot measurements behind decisions; reports go to build/reports/sim/.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'measure'
    }
    systemProperty 'kimetsu.sim.report', layout.buildDirectory.dir('reports/sim').get().asFile.path
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn hotPathTest
    dependsOn simTest
}
