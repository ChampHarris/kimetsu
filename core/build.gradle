// The combat rules as plain Java 25 with JUnit only. Nothing from Minecraft, NeoForge or the mod libraries is on
// this classpath, so `./gradlew :core:test` is fast and an engine import here fails the build (the hook also blocks it).
plugins {
    id 'java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
